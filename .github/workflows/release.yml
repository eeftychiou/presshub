name: Release PressHub AI Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v2.6.0)'
        required: true
        default: 'v2.6.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Package Plugin Archives
        run: |
          # 1. Package the presshub-ai-editor folder into presshub-ai-editor.zip
          zip -r presshub-ai-editor.zip presshub-ai-editor/ -x "*/.*"

          # 2. Package the presshub-social-autopost WordPress plugin into presshub-social-autopost.zip
          zip -r presshub-social-autopost.zip presshub-social-autopost/ -x "*/.*" "presshub-social-autopost/tests/*"

          # 3. Package the presshub-social-worker Node.js service into presshub-social-worker.zip
          zip -r presshub-social-worker.zip presshub-social-worker/ -x "*/.*" "presshub-social-worker/node_modules/*" "presshub-social-worker/sessions/*" "presshub-social-worker/output/*" "presshub-social-worker/tmp/*"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: PressHub AI Suite ${{ steps.vars.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            presshub-ai-editor.zip
            presshub-social-autopost.zip
            presshub-social-worker.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
